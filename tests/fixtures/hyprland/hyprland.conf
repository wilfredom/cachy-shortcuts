# Hyprland config
$mainMod = SUPER
$terminal = alacritty
$browser = firefox

general {
    gaps_in = 5
    gaps_out = 10
}

source = binds.conf

# Applications
bind = $mainMod, Return, exec, $terminal
bindd = $mainMod, B, Web browser, exec, $browser
bind = $mainMod SHIFT, E, exec, nautilus

# Noctalia
bind = $mainMod, Space, exec, noctalia-shell ipc call launcher toggle
bind = $mainMod, D, exec, noctalia-shell ipc call dash toggle

# Windows - run-together modifiers are legal and mean the same chord
bind = $mainMod, Q, killactive,
bindd = SUPERSHIFT, F, Fullscreen, fullscreen, 0
bind = $mainMod, T, togglefloating,
bind = $mainMod, H, movefocus, l

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod SHIFT, 1, movetoworkspace, 1

# Media - no modifier at all, and a repeating bind
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Mouse and raw keycodes stay opaque but must round-trip
bindm = $mainMod, mouse:272, movewindow
bind = code:133, code:24, killactive,

# Locked-screen flag
bindl = $mainMod, L, exec, loginctl lock-session

# System
bind = $mainMod SHIFT, M, exit,

# A submap scopes its binds to that mode only
submap = resize
bind = , right, resizeactive, 10 0
bind = , left, resizeactive, -10 0
bind = $mainMod, Q, submap, reset
bind = , escape, submap, reset
submap = reset
