# MangoWM config
gappih=5
gappiv=5

source=bind.conf
source-optional=extra.conf
source-optional=not-there.conf

# Applications
bind=SUPER,Return,spawn,alacritty
bind=SUPER,b,spawn,firefox
bind=SUPER+SHIFT,e,spawn,nautilus

# DankMaterialShell
bind=SUPER,space,spawn,dms ipc call spotlight toggle
bind=SUPER,d,spawn,dms ipc call dash toggle

# Windows
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER,t,togglefloating,

# Workspaces
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER+SHIFT,1,tag,1

# Media - note NONE modifier and args containing a comma-free percentage
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer -i 5
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%

# Raw keycodes are opaque but must round-trip
bind=code:64+code:133,code:24,killclient,

# Spaced style, the way most hand-written configs read (lap2's included)
bind = SUPER+ALT, Up, focusmon, up
bind = SUPER, r, reload_config

# Locked-screen flag
bindl=SUPER,l,spawn,loginctl lock-session

# System
bind=SUPER+SHIFT,q,quit,

# A keymode scopes every bind after it, until the next keymode line
keymode=resize
bind=NONE,h,resizewin,-10,0
bind=NONE,l,resizewin,10,0
bind=SUPER,q,setkeymode,default
keymode=default
